<!DOCTYPE html>

    <title>Mohamed Taha | BMCO</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f5f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
            padding: 25px 15px;
        }

        .card {
            width: 100%;
            max-width: 575px;
            background: #ffffff;
            border-radius: 18px;
            padding: 38px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .profile-img {
            width: 158px;
            height: 158px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 20%;
            border: 4px solid #2468e5;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 20px;
            color: #111;
            line-height: 1.3;
        }

        .company {
            font-size: 21px;
            font-weight: bold;
            color: #4a4f59;
            margin-bottom: 28px;
        }

        .contact {
            font-size: 18px;
            line-height: 2;
        }

        .contact a {
            color: #26364c;
            text-decoration: none;
            font-weight: bold;
        }

        .contact a:hover {
            color: #2468e5;
        }

        .icon {
            display: inline-block;
            width: 26px;
        }

        .whatsapp {
            margin-top: 25px;
        }

        .whatsapp a {
            font-size: 22px;
            font-weight: bold;
            color: #2468e5;
            text-decoration: none;
        }

        .whatsapp a:hover {
            opacity: 0.8;
        }

        footer {
            margin-top: 35px;
            font-size: 14px;
            color: #9aa0aa;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 18px;
            }

            h1 {
                font-size: 23px;
            }

            .company {
                font-size: 18px;
            }

            .contact {
                font-size: 16px;
            }

            .profile-img {
    width: 165px;

}
